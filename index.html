// ── IndexedDB 유틸 (localStorage 대비 수백MB 저장 가능) ─────────────────
const DB_NAME="vrc_db", DB_VER=2;
let _db=null;

function openDB(){
  if(_db)return Promise.resolve(_db);
  return new Promise((res,rej)=>{
    const req=indexedDB.open(DB_NAME,DB_VER);
    req.onupgradeneeded=e=>{
      const db=e.target.result;
      if(!db.objectStoreNames.contains("kv"))db.createObjectStore("kv");
    };
    req.onsuccess=e=>{_db=e.target.result;res(_db);};
    req.onerror=e=>rej(e);
  });
}
function idbGet(key,fallback=null){
  return openDB().then(db=>new Promise((res,rej)=>{
    const tx=db.transaction("kv","readonly");
    const req=tx.objectStore("kv").get(key);
    req.onsuccess=()=>res(req.result!==undefined?req.result:fallback);
    req.onerror=()=>res(fallback);
  })).catch(()=>fallback);
}
function idbSet(key,val){
  return openDB().then(db=>new Promise((res,rej)=>{
    const tx=db.transaction("kv","readwrite");
    tx.objectStore("kv").put(val,key);
    tx.oncomplete=()=>res();
    tx.onerror=e=>rej(e);
  })).catch(e=>console.error("IDB 저장 실패",e));
}
function idbGetSync(key,fallback=null){
  // 동기 폴백 (초기 렌더용) — localStorage에서 읽음
  try{const v=localStorage.getItem("vrc_"+key);return v?JSON.parse(v):fallback;}
  catch{return fallback;}
}

// 앱 시작 시 localStorage → IndexedDB 마이그레이션
async function migrateFromLS(){
  try{
    const already=await idbGet("migrated_v2");
    if(already)return;
    const keys=["complexes","listings","trades","photos"];
    for(const k of keys){
      const v=localStorage.getItem("vrc_"+k)||localStorage.getItem("vrc_"+k.replace("complexes","complexes"));
      if(v){
        try{await idbSet("vrc_"+k,JSON.parse(v));}catch{}
      }
    }
    // 기존 vrc_ 키들도 시도
    ["vrc_complexes","vrc_listings","vrc_trades","vrc_photos"].forEach(k=>{
      const v=localStorage.getItem(k);
      if(v){try{idbSet(k,JSON.parse(v));}catch{}}
    });
    await idbSet("migrated_v2",true);
    console.log("IndexedDB 마이그레이션 완료");
  }catch(e){console.warn("마이그레이션 실패",e);}
}

// 통합 저장 (사진 분리)
async function saveAll(complexes,listings){
  const photos={};
  const cleanCx=complexes.map(cx=>{
    if(cx.photo)photos["cx_"+cx.id]=cx.photo;
    const{photo,...rest}=cx; return rest;
  });
  const cleanL=listings.map(l=>{
    (l.photos||[]).forEach((p,i)=>{if(p)photos["lp_"+l.id+"_"+i]=p;});
    const{photos:_,...rest}=l; return rest;
  });
  await Promise.all([
    idbSet("vrc_complexes",cleanCx),
    idbSet("vrc_listings",cleanL),
    idbSet("vrc_photos",photos),
  ]);
  // 백업용 localStorage도 텍스트만 저장 (사진 제외)
  try{
    localStorage.setItem("vrc_complexes",JSON.stringify(cleanCx));
    localStorage.setItem("vrc_listings",JSON.stringify(cleanL));
  }catch{}
}

async function loadAll(defaultCx,defaultL){
  await migrateFromLS();
  const [rawCx,rawL,photos]=await Promise.all([
    idbGet("vrc_complexes",null),
    idbGet("vrc_listings",null),
    idbGet("vrc_photos",{}),
  ]);
  const cx=(rawCx||defaultCx).map(cx=>({...cx,photo:photos["cx_"+cx.id]||null}));
  const ls=(rawL||defaultL).map(l=>{
    const lp=[];
    for(let i=0;i<10;i++){const p=photos["lp_"+l.id+"_"+i];if(p)lp.push(p);}
    return{...l,photos:lp};
  });
  return{complexes:cx,listings:ls};
}

// 용량 추정 (IndexedDB는 quota API 사용)
async function getStorageUsage(){
  try{
    if(navigator.storage&&navigator.storage.estimate){
      const{usage,quota}=await navigator.storage.estimate();
      return{used:(usage/1024/1024).toFixed(1),total:(quota/1024/1024).toFixed(0),pct:Math.round(usage/quota*100)};
    }
  }catch{}
  return{used:"?",total:"무제한",pct:0};
}

// 기존 listingId 기반 trades → complexId 기반 마이그레이션
(function migrateTrades(){
  try{
    const raw=localStorage.getItem("vrc_trades");
    if(!raw)return;
    const arr=JSON.parse(raw);
    if(!arr.length||arr[0].complexId!==undefined)return; // 이미 마이그레이션됨
    const listings=JSON.parse(localStorage.getItem("vrc_listings")||"[]");
    const migrated=arr.map(t=>{
      const l=listings.find(x=>x.id===t.listingId);
      return{...t,complexId:l?l.complexId:null};
    }).filter(t=>t.complexId);
    localStorage.setItem("vrc_trades",JSON.stringify(migrated));
    console.log("trades migrated:",migrated.length,"건");
  }catch(e){console.warn("migration error",e);}
})();

  const total=allListings.length||1;
  const supplyRatio=active/total; // 공급 많으면 냉각
  return Math.max(0,Math.min(1, 1-supplyRatio*0.8));
}

// 동적 가격 계산
function calcDynamicPrice(listing,allListings,complexes){
  if(!listing||!allListings||!complexes)return null;
  const complex=complexes.find(c=>c.id===listing.complexId);
  if(!complex)return null;
  const sameActive=allListings.filter(l=>l.complexId===listing.complexId&&l.type===listing.type&&l.status==="판매중").length;
  const guIds=complexes.filter(c=>c.gu===complex.gu).map(c=>c.id);
  const guActive=allListings.filter(l=>guIds.includes(l.complexId)&&l.status==="판매중").length;
  const daysSince=Math.max(0,Math.floor((Date.now()-new Date(listing.registeredAt||Date.now()))/86400000));
  const supplyP=-(sameActive-1)*0.018;
  const guP=-(guActive-5)*0.004;
  const timeP=daysSince>30?-(daysSince-30)*0.0003:daysSince*0.0004;
  // 대출 환경도 가격에 반영
  const mi=marketIndex(allListings,complexes);
  const loanBoost=(mi-0.5)*0.06; // 시장 과열시 가격 상승 압력
  const pct=Math.max(-0.25,Math.min(0.20,supplyP+guP+timeP+loanBoost));
  const adj=v=>v!=null?Math.round(v*(1+pct)/100)*100:null;
  const adjPrice=listing.type==="월세"?listing.price:(adj(listing.price)||listing.price);
  const adjDeposit=listing.deposit!=null?adj(listing.deposit):null;
  const adjMonthly=listing.monthly!=null?Math.round(listing.monthly*(1+pct)):null;
  return{price:adjPrice,deposit:adjDeposit,monthly:adjMonthly,pct:Math.round(pct*1000)/10};
}

// 대출 조건 자동 계산
function calcLoanCondition(price,tradeType,allListings,complexes){
  const mi=marketIndex(allListings||[],complexes||[]);
  // 금리: 시장 과열 → 높음(6%), 냉각 → 낮음(2%)
  const rate=2+mi*4; // 2~6%
  // LTV: 가격 높을수록 낮게, 시장 과열시 낮게
  let maxLtv;
  if(tradeType==="전세"){
    maxLtv=Math.round((0.80-mi*0.20)*100); // 60~80%
  } else {
    // 매매: 가격 구간별 + 시장지수 반영
    const priceB=price/10000; // 억 단위
    let baseLtv=priceB<5?0.90:priceB<10?0.80:priceB<20?0.70:priceB<30?0.60:0.50;
    maxLtv=Math.round((baseLtv-mi*0.15)*100);
  }
  maxLtv=Math.max(40,Math.min(90,maxLtv));
  return{rate:Math.round(rate*10)/10,maxLtv,mi:Math.round(mi*100)};
}

// 월 상환액 계산 (원리금균등)
function calcMonthly(principal,annualRate,years){
  if(!principal||!annualRate||!years)return 0;
  const r=annualRate/100/12;
  const n=years*12;
  if(r===0)return Math.round(principal/n);
  return Math.round(principal*(r*Math.pow(1+r,n))/(Math.pow(1+r,n)-1));
}

// 가격 태그 (▲▼)
function PriceTag({pct}){
  if(!pct||Math.abs(pct)<0.3)return null;
  const up=pct>0;
  return h("span",{style:{fontSize:10,fontWeight:800,padding:"1px 5px",borderRadius:4,
    background:up?"#fef2f2":"#f0fdf4",color:up?"#dc2626":"#16a34a",marginLeft:5,verticalAlign:"middle"}},
    (up?"▲":"▼")+Math.abs(pct)+"%"
  );
}

function priceLabel(listing,allListings,complexes){
  if(!listing)return"-";
  const dp=(allListings&&complexes)?calcDynamicPrice(listing,allListings,complexes):null;
  const p=dp||listing;
  let base;
  if(listing.type==="월세"){
    const dep=p.deposit!=null?p.deposit:(listing.deposit||0);
    const mon=p.monthly!=null?p.monthly:(listing.monthly||0);
    base=`보 ${fmt(dep)} / 월 ${mon}만`;
  } else if(listing.type==="전세"){
    const dep=p.deposit!=null?p.deposit:(listing.deposit||listing.price||0);
    base=fmt(dep);
  } else {
    base=fmt(p.price!=null?p.price:(listing.price||0));
  }
  if(!dp||Math.abs(dp.pct)<0.3)return base;
  return h(Fragment,null,base,h(PriceTag,{pct:dp.pct}));
}

function complexLabel(c){
  const tag=c.type==="오피스텔"?" (오)":c.type==="빌라"?" (빌)":"";
  return c.name+tag+" — "+c.gu+" "+c.dong;
}

// ── 꺾은선 그래프 (SVG) ──────────────────────────────────────────────────────
function LineChart({data,color,height=160,label}){
  if(!data||data.length<2)return h("div",{style:{textAlign:"center",padding:30,color:"#94a3b8",fontSize:12}},"데이터 수집 중...");
  const vals=data.map(d=>d.v);
  const min=Math.min(...vals),max=Math.max(...vals);
  const range=max-min||1;
  const W=340,H=height,PAD={t:12,r:12,b:28,l:52};
  const iw=W-PAD.l-PAD.r,ih=H-PAD.t-PAD.b;
  const px=(i)=>PAD.l+i/(data.length-1)*iw;
  const py=(v)=>PAD.t+ih-(v-min)/range*ih;
  const pts=data.map((d,i)=>`${px(i)},${py(d.v)}`).join(" ");
  const fillPts=`${PAD.l},${PAD.t+ih} `+data.map((d,i)=>`${px(i)},${py(d.v)}`).join(" ")+` ${PAD.l+iw},${PAD.t+ih}`;
  // Y축 레이블 3개
  const yTicks=[min,min+range/2,max];
  return h("div",{style:{overflowX:"auto"}},
    h("svg",{viewBox:`0 0 ${W} ${H}`,style:{width:"100%",minWidth:260,display:"block"}},
      // 배경 그리드
      ...[0,0.5,1].map(t=>h("line",{key:t,x1:PAD.l,y1:PAD.t+ih*(1-t),x2:PAD.l+iw,y2:PAD.t+ih*(1-t),stroke:"#e2e8f0",strokeWidth:1,strokeDasharray:"4,4"})),
      // 채우기
      h("polygon",{points:fillPts,fill:color+"22",stroke:"none"}),
      // 꺾은선
      h("polyline",{points:pts,fill:"none",stroke:color,strokeWidth:2.5,strokeLinejoin:"round",strokeLinecap:"round"}),
      // 데이터 포인트
      ...data.map((d,i)=>h("circle",{key:i,cx:px(i),cy:py(d.v),r:3.5,fill:"#fff",stroke:color,strokeWidth:2})),
      // X축 레이블 (첫/중/끝)
      ...[0,Math.floor((data.length-1)/2),data.length-1].map(i=>h("text",{key:"x"+i,x:px(i),y:H-6,textAnchor:"middle",fontSize:9,fill:"#94a3b8"},data[i].label)),
      // Y축 레이블
      ...yTicks.map((v,i)=>h("text",{key:"y"+i,x:PAD.l-4,y:py(v)+4,textAnchor:"end",fontSize:9,fill:"#64748b"},fmt(v)))
    )
  );
}

// 시세 이력 생성 (가상 과거 데이터 + 실거래 포함)
function buildPriceHistory(listing,allListings,complexes,trades){
  if(!listing)return[];
  const cxId=listing.complexId;
  const base=listing.type==="월세"?(listing.deposit||0):(listing.price||listing.deposit||0);
  const dp=calcDynamicPrice(listing,allListings,complexes);
  const now=dp?dp.price:base;
  // 단지 단위 실거래 기록 (같은 단지 모든 매물 공유)
  const cxTrades=(trades||[]).filter(t=>t.complexId===cxId).slice(-20);
  // 가상 6개월 이력
  const months=["1월","2월","3월","4월","5월","6월","현재"];
  const seed=cxId*7+base;
  const pts=months.map((label,i)=>{
    if(i===months.length-1)return{label,v:now};
    const noise=((seed*(i+1)*1234567)%100-50)/1000;
    const trend=(i-3)*0.005;
    return{label,v:Math.round(base*(1+trend+noise)/100)*100};
  });
  // 실거래 최근 3건으로 그래프 후반부 덮어쓰기
  const recent=cxTrades.slice(-3);
  recent.forEach((t,i)=>{
    const idx=Math.max(0,pts.length-3+i);
    pts[idx]={label:t.date,v:t.price};
  });
  return pts;
}

// 단지 평균 시세 이력
function buildComplexPriceHistory(complex,allListings,complexes,trades){
  const cxListings=allListings.filter(l=>l.complexId===complex.id&&l.type==="매매");
  if(!cxListings.length)return[];
  const months=["1월","2월","3월","4월","5월","6월","현재"];
  const pts=months.map((label,i)=>{
    const avg=cxListings.reduce((s,l)=>{
      const base=l.price||0;
      const seed=l.id*7+base;
      const noise=((seed*(i+1)*1234567)%100-50)/1000;
      const trend=(i-3)*0.005;
      const v=i===months.length-1?(calcDynamicPrice(l,allListings,complexes)?.price||base):Math.round(base*(1+trend+noise)/100)*100;
      return s+v;
    },0)/cxListings.length;
    return{label,v:Math.round(avg/100)*100};
  });
  // 단지 실거래 기록으로 후반부 덮어쓰기
  const cxTrades=(trades||[]).filter(t=>t.complexId===complex.id).slice(-3);
  cxTrades.forEach((t,i)=>{
    const idx=Math.max(0,pts.length-3+i);
    pts[idx]={label:t.date,v:t.price};
  });
  return pts;
}

// ── 실거래 내역 컴포넌트 ─────────────────────────────────────────────────────
function TradeHistory({complexId,trades,color}){
  const myTrades=(trades||[]).filter(t=>t.complexId===complexId).slice().reverse();

}

// ── 대출 계산기 컴포넌트 ─────────────────────────────────────────────────────
function LoanCalc({listing,allListings,complexes}){
  const dp=calcDynamicPrice(listing,allListings,complexes);
  if(!listing||listing.type==="월세")return null;
  const currentPrice=(dp?.price||listing.price||listing.deposit)||0;
  const tradeType=listing.type==="전세"?"전세":"매매";
  const cond=calcLoanCondition(currentPrice,tradeType,allListings,complexes);

  const [ltvPct,setLtvPct]=useState(Math.round(cond.maxLtv*0.7));
  const [years,setYears]=useState(30);
  const loanAmt=Math.round(currentPrice*ltvPct/100/100)*100;
  const monthly=calcMonthly(loanAmt*10000,cond.rate,years); // 만원→원

  const mktColor=cond.mi>66?"#ef4444":cond.mi>33?"#f59e0b":"#10b981";
  const mktLabel=cond.mi>66?"과열":"정상";

  return h("div",{style:{background:"#f8fafc",borderRadius:14,padding:18}},
    // 시장 현황
    h("div",{style:{display:"flex",gap:10,marginBottom:16,flexWrap:"wrap"}},
      h("div",{style:{flex:1,background:"#fff",borderRadius:10,padding:"10px 14px",minWidth:100}},
        h("div",{style:{fontSize:10,color:"#94a3b8",marginBottom:2}},"현재 시세"),
        h("div",{style:{fontSize:16,fontWeight:800,color:"#1e40af"}},fmt(currentPrice))
      ),
      h("div",{style:{flex:1,background:"#fff",borderRadius:10,padding:"10px 14px",minWidth:100}},
        h("div",{style:{fontSize:10,color:"#94a3b8",marginBottom:2}},"자동 금리"),
        h("div",{style:{fontSize:16,fontWeight:800,color:"#dc2626"}},cond.rate+"%")
      ),
      h("div",{style:{flex:1,background:"#fff",borderRadius:10,padding:"10px 14px",minWidth:80}},
        h("div",{style:{fontSize:10,color:"#94a3b8",marginBottom:2}},"시장"),
        h("div",{style:{fontSize:14,fontWeight:800,color:mktColor}},mktLabel),
        h("div",{style:{fontSize:10,color:"#94a3b8"}},cond.mi+"%")
      )
    ),
    // LTV 슬라이더
    h("div",{style:{marginBottom:14}},
      h("div",{style:{display:"flex",justifyContent:"space-between",fontSize:12,marginBottom:6}},
        h("span",{style:{fontWeight:600,color:"#475569"}},"대출 비율"),
        h("span",{style:{fontWeight:800,color:"#1e40af"}},ltvPct+"% (최대 "+cond.maxLtv+"%)")
      ),
      h("input",{type:"range",min:10,max:cond.maxLtv,value:ltvPct,onChange:e=>setLtvPct(Number(e.target.value)),
        style:{width:"100%",accentColor:"#1e40af"}})
    ),
    // 대출 기간
    h("div",{style:{marginBottom:16}},
      h("div",{style:{display:"flex",justifyContent:"space-between",fontSize:12,marginBottom:6}},
        h("span",{style:{fontWeight:600,color:"#475569"}},"대출 기간"),
        h("span",{style:{fontWeight:800,color:"#1e40af"}},years+"년")
      ),
      h("div",{style:{display:"flex",gap:6}},
        ...[10,15,20,30].map(y=>h(Btn,{key:y,onClick:()=>setYears(y),style:{flex:1,padding:"7px 0",borderRadius:8,border:`2px solid ${years===y?"#1e40af":"#e2e8f0"}`,background:years===y?"#dbeafe":"#fff",color:years===y?"#1e40af":"#64748b",fontWeight:700,fontSize:12}},y+"년"))
      )
    ),
    // 결과
    h("div",{style:{background:"linear-gradient(135deg,#1e40af,#3b82f6)",borderRadius:12,padding:18,color:"#fff"}},
      h("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}},
        h("div",null,
          h("div",{style:{fontSize:10,color:"rgba(255,255,255,0.7)",marginBottom:2}},"대출 금액"),
          h("div",{style:{fontSize:18,fontWeight:900}},fmt(loanAmt))
        ),
        h("div",null,
          h("div",{style:{fontSize:10,color:"rgba(255,255,255,0.7)",marginBottom:2}},"월 상환액"),
          h("div",{style:{fontSize:18,fontWeight:900}},monthly.toLocaleString()+"원")
        ),
        h("div",null,
          h("div",{style:{fontSize:10,color:"rgba(255,255,255,0.7)",marginBottom:2}},"총 이자"),
          h("div",{style:{fontSize:14,fontWeight:700}},fmt(Math.round((monthly*years*12-loanAmt*10000)/10000)*10000))
        ),
        h("div",null,
          h("div",{style:{fontSize:10,color:"rgba(255,255,255,0.7)",marginBottom:2}},"자기자본"),
          h("div",{style:{fontSize:14,fontWeight:700}},fmt(currentPrice-loanAmt))
        )
      )
    ),
    h("div",{style:{fontSize:10,color:"#94a3b8",marginTop:8,textAlign:"center"}},"* 금리·LTV는 시장 상황에 따라 자동 조정됩니다")
  );
}

// base64 이미지 변환
function fileToBase64(file){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=e=>res(e.target.result);
    r.onerror=rej;
    r.readAsDataURL(file);
  });
}

  }
  return h("div",{style:{height,display:"flex",alignItems:"center",justifyContent:"center",fontSize:size,...style}},emoji||"🏠");
}

// ── 사진 업로드 버튼 ────────────────────────────────────────────────────────
function PhotoUpload({current,onUpload,label="사진 추가",multi=false}){
  const ref=useRef();
  const handle=async(e)=>{
    const files=Array.from(e.target.files);
    if(!files.length)return;
    const b64s=await Promise.all(files.map(fileToBase64));
    onUpload(multi?b64s:b64s[0]);
    e.target.value="";

  return h("div",null,

function useDialog(){
  const [state,setState]=useState(null);
  const confirm=useCallback((message,sub)=>new Promise(r=>setState({type:"confirm",message,sub,r})),[]);
  const alert=useCallback((message)=>new Promise(r=>setState({type:"alert",message,r})),[]);
  const Modal=state
    ?(state.type==="confirm"
        ?h(ConfirmModal,{message:state.message,sub:state.sub,onOk:()=>{setState(null);state.r(true);},onCancel:()=>{setState(null);state.r(false);}})
        :h(AlertModal,{message:state.message,onClose:()=>{setState(null);state.r();}}))
    :null;
  return {confirm,alert,Modal};
}

// ── 사용자 앱 ───────────────────────────────────────────────────────────────
function UserApp({listings,complexes,trades,setTrades}){
  const [tab,setTab]=useState("map");
  const [selGus,setSelGus]=useState([]);
  const [selDong,setSelDong]=useState("전체");
  const [trade,setTrade]=useState("전체");
  const [propType,setPropType]=useState("전체");
  const [kw,setKw]=useState("");
  const [selL,setSelL]=useState(null);
  const [selCx,setSelCx]=useState(null);
  const [fromCxL,setFromCxL]=useState(null);

  const toggleGu=gu=>{setSelGus(p=>p.includes(gu)?p.filter(g=>g!==gu):[...p,gu]);setSelDong("전체");};

  // 실거래 기록 추가
  // 실거래 기록 — 단지 단위로 저장 (같은 단지 매물들이 공유)
  const addTrade=useCallback((listing)=>{
    const dp=calcDynamicPrice(listing,listings,complexes);
    const price=listing.type==="월세"?(dp?.deposit||listing.deposit||0):(dp?.price||listing.price||listing.deposit||0);
    const cxId=listing.complexId;
    const last=(trades||[]).filter(t=>t.complexId===cxId).slice(-1)[0];
    const delta=last?price-last.price:0;
    const now=new Date();
    const dateStr=`${now.getMonth()+1}/${now.getDate()} ${now.getHours()}:${String(now.getMinutes()).padStart(2,'0')}`;
    const newTrade={id:Date.now(),complexId:cxId,price,delta,date:dateStr};
    const updated=[...(trades||[]),newTrade];
    setTrades(updated);
    saveTrades(updated);
  },[listings,complexes,trades]);

  const counts=useMemo(()=>{
    const c={};
    ALL_GU.forEach(gu=>{const ids=complexes.filter(cx=>cx.gu===gu).map(cx=>cx.id);c[gu]=listings.filter(l=>ids.includes(l.complexId)&&l.status==="판매중").length;});
    return c;
  },[listings,complexes]);

  const dongs=useMemo(()=>selGus.length===0?["전체"]:["전체",...selGus.flatMap(g=>DISTRICTS[g].dongs)],[selGus]);

  const filtered=useMemo(()=>listings.filter(l=>{
    if(l.status!=="판매중")return false;
    const c=complexes.find(cx=>cx.id===l.complexId);if(!c)return false;
    if(selGus.length>0&&!selGus.includes(c.gu))return false;
    if(selDong!=="전체"&&c.dong!==selDong)return false;
    if(trade!=="전체"&&l.type!==trade)return false;
    if(propType!=="전체"&&c.type!==propType)return false;
    if(kw&&!c.name.includes(kw)&&!c.address.includes(kw))return false;
    return true;
  }),[listings,complexes,selGus,selDong,trade,propType,kw]);

  const filtCx=useMemo(()=>complexes.filter(c=>{
    if(selGus.length>0&&!selGus.includes(c.gu))return false;
    if(selDong!=="전체"&&c.dong!==selDong)return false;
    if(propType!=="전체"&&c.type!==propType)return false;
    if(kw&&!c.name.includes(kw))return false;
    return true;
  }),[complexes,selGus,selDong,propType,kw]);

  if(fromCxL){const c=complexes.find(cx=>cx.id===fromCxL.complexId);return h(ListingDetail,{listing:fromCxL,complex:c,onBack:()=>setFromCxL(null),allListings:listings,allComplexes:complexes,trades,onAddTrade:addTrade});}
  if(selL){const c=complexes.find(cx=>cx.id===selL.complexId);return h(ListingDetail,{listing:selL,complex:c,onBack:()=>setSelL(null),allListings:listings,allComplexes:complexes,trades,onAddTrade:addTrade});}

function StorageBar(){
  const [info,setInfo]=useState({used:"...",total:"측정중",pct:0});
  useEffect(()=>{
    getStorageUsage().then(v=>setInfo(v));
  },[]);
  const col=info.pct>80?"#dc2626":info.pct>50?"#f59e0b":"#10b981";
  return h("div",{style:{background:"#f8fafc",borderRadius:10,padding:"8px 14px",marginBottom:12,display:"flex",alignItems:"center",gap:10}},
    h("span",{style:{fontSize:11,color:"#64748b",whiteSpace:"nowrap"}},"💾 IndexedDB"),
    h("div",{style:{flex:1,background:"#e2e8f0",borderRadius:4,height:6,overflow:"hidden"}},
      info.pct>0?h("div",{style:{width:Math.min(100,info.pct)+"%",height:"100%",background:col,borderRadius:4,transition:"width 0.3s"}}):null
    ),
    h("span",{style:{fontSize:11,fontWeight:600,color:col,whiteSpace:"nowrap"}},
      info.used+"MB / "+info.total+(info.total==="무제한"?"":"MB")
    )
  );
}

      h("div",{style:{fontWeight:800,fontSize:16,color:"#0f172a",marginBottom:16}},editItem?"단지 수정":"새 단지 등록"),
      fld("단지명",h("input",{value:cForm.name,onChange:e=>setCForm(f=>({...f,name:e.target.value})),placeholder:"예: 오션뷰 아파트",style:iS})),
      fld("이모지 아이콘 (사진이 없을 때)",h("input",{value:cForm.thumbnail,onChange:e=>setCForm(f=>({...f,thumbnail:e.target.value})),style:iS})),
      fld("대표 사진",h("div",null,
        cForm.photo&&h("img",{src:cForm.photo,alt:"",style:{width:"100%",height:140,objectFit:"cover",borderRadius:10,marginBottom:8}}),
        h(PhotoUpload,{current:!!cForm.photo,label:"단지 대표사진 업로드",onUpload:b64=>setCForm(f=>({...f,photo:b64}))}),
        cForm.photo&&h(Btn,{onClick:()=>setCForm(f=>({...f,photo:null})),style:{marginTop:6,fontSize:12,color:"#ef4444",background:"#fff0f0",border:"none",borderRadius:6,padding:"5px 10px",cursor:"pointer"}},"사진 제거")
      )),
      fld("구 선택",h("select",{value:cForm.gu,onChange:e=>setCForm(f=>({...f,gu:e.target.value,dong:""})),style:iS},...ALL_GU.map(g=>h("option",{key:g},g)))),
      fld("동 선택",h("select",{value:cForm.dong,onChange:e=>setCForm(f=>({...f,dong:e.target.value})),style:iS},h("option",{value:""},"선택"),...(DISTRICTS[cForm.gu]?.dongs||[]).map(d=>h("option",{key:d},d)))),
      fld("주소",h("input",{value:cForm.address,onChange:e=>setCForm(f=>({...f,address:e.target.value})),style:iS})),
      fld("유형",h("select",{value:cForm.type,onChange:e=>setCForm(f=>({...f,type:e.target.value})),style:iS},...["아파트","오피스텔","빌라"].map(t=>h("option",{key:t},t)))),
      h("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:10}},
        fld("총세대",h("input",{type:"number",value:cForm.totalUnits,onChange:e=>setCForm(f=>({...f,totalUnits:e.target.value})),style:iS})),
        fld("층수",h("input",{type:"number",value:cForm.floors,onChange:e=>setCForm(f=>({...f,floors:e.target.value})),style:iS})),
        fld("준공년도",h("input",{type:"number",value:cForm.year,onChange:e=>setCForm(f=>({...f,year:e.target.value})),placeholder:"2024",style:iS}))
      ),
      fld("편의시설 (쉼표 구분)",h("input",{value:cForm.amenities,onChange:e=>setCForm(f=>({...f,amenities:e.target.value})),placeholder:"수영장, 헬스장, 주차장",style:iS})),
      h("div",{style:{display:"flex",gap:10,marginTop:6}},
        h(Btn,{onClick:saveC,style:{flex:1,background:"#dc2626",color:"#fff",borderRadius:10,padding:"12px 0",fontWeight:700,fontSize:14}},"저장"),
        h(Btn,{onClick:()=>setShowForm(false),style:{flex:1,background:"#f1f5f9",color:"#475569",borderRadius:10,padding:"12px 0",fontWeight:700,fontSize:14}},"취소")
      )
    )
  );
}

// ── 루트 ────────────────────────────────────────────────────────────────────
function App(){
  const [mode,setMode]=useState("user");
  const [complexes,setComplexes]=useState(()=>lsGet(LS_COMPLEXES,DEFAULT_COMPLEXES).map(cx=>({...cx,photo:null})));
  const [listings,setListings]=useState(()=>lsGet(LS_LISTINGS,DEFAULT_LISTINGS).map(l=>({...l,photos:[]})));
  const [trades,setTrades]=useState([]);
  const [loaded,setLoaded]=useState(false);

  // IndexedDB에서 비동기 로드
  useEffect(()=>{
    loadAll(DEFAULT_COMPLEXES,DEFAULT_LISTINGS).then(({complexes:cx,listings:ls})=>{
      setComplexes(cx);
      setListings(ls);
    });
    loadTrades().then(t=>setTrades(t||[]));
    setTimeout(()=>setLoaded(true),300);
  },[]);

  if(!loaded)return h("div",{style:{minHeight:"100vh",background:"#0f172a",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:16}},
    h("div",{style:{fontSize:48}},"🏙️"),
    h("div",{style:{color:"#fff",fontWeight:700,fontSize:18}},"가상도시 부동산"),
    h("div",{style:{color:"#64748b",fontSize:13}},"데이터 불러오는 중..."),
    h("div",{style:{width:48,height:48,border:"4px solid #1e3a5f",borderTop:"4px solid #3b82f6",borderRadius:"50%",animation:"spin 0.8s linear infinite"}}),
    h("style",null,"@keyframes spin{to{transform:rotate(360deg)}}")
  );

  const headerBg=mode==="user"?"linear-gradient(135deg,#0f172a,#1e3a5f 60%,#0c4a6e)":"linear-gradient(135deg,#7f1d1d,#991b1b,#dc2626)";
  const modeBtn=(v,label)=>h(Btn,{onClick:()=>setMode(v),style:{padding:"7px 12px",borderRadius:8,fontSize:12,fontWeight:700,background:mode===v?"rgba(255,255,255,0.18)":"transparent",color:mode===v?"#fff":"rgba(255,255,255,0.45)"}},label);

  return h("div",{style:{minHeight:"100vh",background:mode==="user"?"#f0f4f8":"#fff5f5"}},
    h("div",{style:{background:headerBg,padding:"0 20px",boxShadow:"0 4px 20px rgba(0,0,0,0.3)",position:"sticky",top:0,zIndex:100}},
      h("div",{style:{maxWidth:960,margin:"0 auto",display:"flex",justifyContent:"space-between",alignItems:"center",height:58}},
        h("div",{style:{display:"flex",alignItems:"center",gap:10}},
          h("span",{style:{fontSize:22}},"🏙️"),
          h("div",null,
            h("div",{style:{color:"#fff",fontWeight:900,fontSize:17}},"가상도시 부동산"),
            h("div",{style:{color:"rgba(255,255,255,0.4)",fontSize:10}},mode==="user"?"7개 구 · 22개 동":"관리자 콘솔")
          )
        ),
        h("div",{style:{display:"flex",gap:4}},modeBtn("user","🏠 사용자"),modeBtn("admin","⚙️ 관리자"))
      )
    ),
    mode==="admin"&&h("div",{style:{background:"#dc2626",padding:"6px 20px",textAlign:"center"}},
      h("span",{style:{color:"#fff",fontSize:11,fontWeight:600}},"⚠️ 관리자 전용 — 변경사항 자동 저장")
    ),
    h("div",{style:{maxWidth:960,margin:"0 auto",padding:"22px 14px 80px"}},
      mode==="user"?h(UserApp,{listings,complexes,trades,setTrades}):h(AdminApp,{listings,setListings,complexes,setComplexes})
    )
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(h(App,null));
</script>
</body>
</html>
