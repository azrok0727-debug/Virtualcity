<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>매물 비교 계산기</title>
<meta name="description" content="전세·반전세·월세 매물을 비교해서 몇 년 뒤 자산이 얼마나 모이는지 계산해요." />

<!-- PWA: 홈 화면에 추가했을 때 동작 설정 -->
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#1f2420" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="매물비교" />
<link rel="apple-touch-icon" href="icon-192.png" />
<link rel="icon" href="icon-192.png" />

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>

<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: #f6f4ef; }
  body {
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    overscroll-behavior-y: contain;
  }
  #root { min-height: 100vh; }
  input[type="number"]::-webkit-outer-spin-button,
  input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  input[type="number"] { -moz-appearance: textfield; }

  .page { min-height: 100vh; background: #f6f4ef; color: #1f2420; padding: 0 0 64px 0; }
  .hero { background: #1f2420; color: #f6f4ef; padding: max(36px, env(safe-area-inset-top)) 20px 28px; position: relative; overflow: hidden; }
  .hero::after { content: ""; position: absolute; right: -40px; top: -40px; width: 180px; height: 180px; border-radius: 50%; background: radial-gradient(circle, rgba(212,165,98,0.35), transparent 70%); }
  .hero-eyebrow { font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: #d4a562; font-weight: 600; margin-bottom: 8px; }
  .hero h1 { font-size: 26px; line-height: 1.35; margin: 0 0 6px; font-weight: 700; letter-spacing: -0.01em; }
  .hero p { font-size: 13.5px; color: #c9c4b8; margin: 0; line-height: 1.5; }
  .container { max-width: 720px; margin: 0 auto; padding: 20px 16px 0; }
  .section-title { font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #8a8275; margin: 28px 2px 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .section-title-left { display: flex; align-items: center; gap: 8px; }
  .section-title .dot { width: 7px; height: 7px; border-radius: 50%; }
  .dot-shared { background: #8a8275; }
  .dot-jeonse { background: #3b6e5e; }
  .dot-ban { background: #9b7e2c; }
  .dot-wolse { background: #b3552c; }
  .card { background: #ffffff; border: 1px solid #e7e2d6; border-radius: 14px; padding: 18px 16px; margin-bottom: 14px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 420px) { .grid2 { grid-template-columns: 1fr; } }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field-label { font-size: 12.5px; color: #5b574c; font-weight: 600; }
  .field-input-wrap { display: flex; align-items: center; border: 1.5px solid #e3ddcd; border-radius: 9px; background: #fbfaf6; padding: 0 10px; transition: border-color 0.15s; }
  .field-input-wrap:focus-within { border-color: #b3552c; }
  .field-input { flex: 1; border: none; background: transparent; padding: 10px 4px; font-size: 16px; font-weight: 600; color: #1f2420; width: 0; min-width: 0; outline: none; font-family: inherit; }
  .text-input { font-size: 14.5px; }
  .field-suffix { font-size: 12.5px; color: #a39c8c; white-space: nowrap; }
  .panel-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 14px; gap: 10px; }
  .panel-head h3 { margin: 0; font-size: 16.5px; font-weight: 700; }
  .panel-rank { font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
  .result-list { margin-top: 14px; border-top: 1px dashed #e3ddcd; padding-top: 12px; display: flex; flex-direction: column; gap: 9px; }
  .result-row { display: flex; justify-content: space-between; align-items: baseline; font-size: 13.5px; }
  .result-row .k { color: #6b6657; }
  .result-row .v { font-weight: 700; font-variant-numeric: tabular-nums; }
  .result-row.total { margin-top: 4px; padding-top: 10px; border-top: 1px solid #e7e2d6; font-size: 15px; }
  .result-row.total .v { font-size: 17px; }
  .neg { color: #b3402c; }
  .pos { color: #1f2420; }
  .compare-card { background: #1f2420; color: #f6f4ef; border-radius: 16px; padding: 22px 18px; margin-top: 22px; margin-bottom: 18px; }
  .compare-card .label { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: #9b9588; margin-bottom: 10px; }
  .compare-winner { font-size: 22px; font-weight: 800; margin-bottom: 4px; }
  .accent-jeonse { color: #6fb89a; }
  .accent-ban { color: #e0bc5c; }
  .accent-wolse { color: #e8946a; }
  .compare-sub { font-size: 13px; color: #c9c4b8; margin-bottom: 18px; }
  .bars { display: flex; flex-direction: column; gap: 12px; }
  .bar-row { display: flex; align-items: center; gap: 10px; }
  .bar-label { width: 96px; font-size: 12.5px; color: #c9c4b8; font-weight: 600; flex-shrink: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar-track { flex: 1; background: rgba(255,255,255,0.08); border-radius: 6px; height: 28px; position: relative; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 6px; display: flex; align-items: center; justify-content: flex-end; padding-right: 8px; font-size: 12px; font-weight: 700; color: #1f2420; white-space: nowrap; transition: width 0.4s ease; }
  .bar-jeonse { background: #6fb89a; }
  .bar-ban { background: #e0bc5c; }
  .bar-wolse { background: #e8946a; }
  .assumptions { font-size: 11.5px; color: #a39c8c; line-height: 1.6; margin-top: 8px; }
  .small-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  @media (max-width: 420px) { .small-grid { grid-template-columns: 1fr 1fr; } }
  .warn-badge { display: inline-block; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 999px; background: #fbe6df; color: #b3402c; margin-top: 8px; }
  .footnote { font-size: 11.5px; color: #a39c8c; line-height: 1.6; padding: 0 4px; margin-top: 4px; }
  .type-switch { display: flex; gap: 6px; margin-bottom: 14px; }
  .type-btn { flex: 1; padding: 8px 0; border-radius: 8px; border: 1.5px solid #e3ddcd; background: #fbfaf6; color: #5b574c; font-size: 13px; font-weight: 700; cursor: pointer; transition: all 0.15s; font-family: inherit; }
  .type-btn.active { color: #ffffff; }
  .property-name-row { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
  .property-name-input { font-size: 16.5px; font-weight: 700; border: none; background: transparent; outline: none; border-bottom: 1.5px dashed transparent; padding: 2px 0; min-width: 0; flex: 1; font-family: inherit; color: #1f2420; }
  .property-name-input:focus { border-bottom-color: #b3552c; }
  .remove-btn { border: none; background: transparent; color: #b3a99a; font-size: 18px; cursor: pointer; padding: 4px 6px; line-height: 1; flex-shrink: 0; }
  .remove-btn:hover { color: #b3402c; }
  .add-btn { width: 100%; padding: 14px; border-radius: 14px; border: 1.5px dashed #c9bfa8; background: transparent; color: #6b6657; font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit; margin-bottom: 18px; }
  .add-btn:hover { border-color: #b3552c; color: #b3552c; }
  .empty-state { text-align: center; padding: 32px 16px; color: #a39c8c; font-size: 13.5px; }
  .install-banner { position: sticky; top: 0; z-index: 20; background: #d4a562; color: #1f2420; font-size: 12.5px; font-weight: 600; padding: 10px 16px; text-align: center; display: none; }
  .install-banner.show { display: block; }
  .install-banner button { margin-left: 10px; background: #1f2420; color: #f6f4ef; border: none; border-radius: 999px; padding: 4px 12px; font-size: 11.5px; font-weight: 700; cursor: pointer; }
  .save-pill { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%) translateY(20px); background: #1f2420; color: #f6f4ef; font-size: 12px; font-weight: 600; padding: 8px 16px; border-radius: 999px; opacity: 0; transition: all 0.25s ease; pointer-events: none; z-index: 30; }
  .save-pill.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react,env">
const { useState, useMemo, useEffect, useRef } = React;

const STORAGE_KEY = "jeonse-compare-v1";

const manwon = (n) => {
  if (n === null || n === undefined || isNaN(n)) return "0";
  return Math.round(n).toLocaleString("ko-KR");
};

let nextId = 4;

function makeProperty(type, name) {
  const base = { id: nextId++, name, type };
  if (type === "jeonse") {
    return { ...base, deposit: 30000, loan: 20000 };
  }
  if (type === "banjeonse") {
    return { ...base, deposit: 15000, loan: 10000, rent: 25 };
  }
  return { ...base, deposit: 3000, loan: 0, rent: 60 };
}

const TYPE_META = {
  jeonse: { label: "전세", color: "#3b6e5e", accent: "accent-jeonse", dot: "dot-jeonse", bar: "bar-jeonse" },
  banjeonse: { label: "반전세", color: "#9b7e2c", accent: "accent-ban", dot: "dot-ban", bar: "bar-ban" },
  wolse: { label: "월세", color: "#b3552c", accent: "accent-wolse", dot: "dot-wolse", bar: "bar-wolse" },
};

const DEFAULT_STATE = {
  salary: 260,
  bonus: 400,
  mgmtFee: 15,
  moveCost: 25,
  livingCost: 60,
  investRate: 4,
  loanRate: 4,
  years: 5,
  currentNetWorth: 0,
  properties: [
    { id: 1, name: "역삼동 전세", type: "jeonse", deposit: 30000, loan: 20000 },
    { id: 2, name: "삼성동 반전세", type: "banjeonse", deposit: 15000, loan: 10000, rent: 25 },
    { id: 3, name: "논현동 월세", type: "wolse", deposit: 3000, loan: 0, rent: 60 },
  ],
};

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return DEFAULT_STATE;
    const parsed = JSON.parse(raw);
    const maxId = Math.max(0, ...(parsed.properties || []).map((p) => p.id || 0));
    nextId = maxId + 1;
    return { ...DEFAULT_STATE, ...parsed };
  } catch (e) {
    return DEFAULT_STATE;
  }
}

function NumberField({ label, value, onChange, suffix = "만원" }) {
  return (
    <label className="field">
      <span className="field-label">{label}</span>
      <div className="field-input-wrap">
        <input
          type="number"
          inputMode="decimal"
          value={value}
          onChange={(e) => onChange(e.target.value === "" ? "" : Number(e.target.value))}
          className="field-input"
          placeholder="0"
        />
        <span className="field-suffix">{suffix}</span>
      </div>
    </label>
  );
}

function TypeSwitch({ value, onChange }) {
  return (
    <div className="type-switch">
      {Object.entries(TYPE_META).map(([key, meta]) => (
        <button
          key={key}
          type="button"
          className={`type-btn ${value === key ? "active" : ""}`}
          style={value === key ? { background: meta.color, borderColor: meta.color } : {}}
          onClick={() => onChange(key)}
        >
          {meta.label}
        </button>
      ))}
    </div>
  );
}

function App() {
  const initial = useMemo(loadState, []);
  const [salary, setSalary] = useState(initial.salary);
  const [bonus, setBonus] = useState(initial.bonus);
  const [mgmtFee, setMgmtFee] = useState(initial.mgmtFee);
  const [moveCost, setMoveCost] = useState(initial.moveCost);
  const [livingCost, setLivingCost] = useState(initial.livingCost);
  const [investRate, setInvestRate] = useState(initial.investRate);
  const [loanRate, setLoanRate] = useState(initial.loanRate);
  const [years, setYears] = useState(initial.years);
  const [currentNetWorth, setCurrentNetWorth] = useState(initial.currentNetWorth);
  const [properties, setProperties] = useState(initial.properties);

  const [showSaved, setShowSaved] = useState(false);
  const saveTimer = useRef(null);
  const isFirstRun = useRef(true);

  const [deferredPrompt, setDeferredPrompt] = useState(null);
  const [showInstallBanner, setShowInstallBanner] = useState(false);

  useEffect(() => {
    const handler = (e) => {
      e.preventDefault();
      setDeferredPrompt(e);
      const dismissed = localStorage.getItem("install-dismissed");
      const isStandalone = window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone;
      if (!dismissed && !isStandalone) setShowInstallBanner(true);
    };
    window.addEventListener("beforeinstallprompt", handler);
    return () => window.removeEventListener("beforeinstallprompt", handler);
  }, []);

  async function handleInstallClick() {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    setDeferredPrompt(null);
    setShowInstallBanner(false);
  }

  function dismissInstallBanner() {
    localStorage.setItem("install-dismissed", "1");
    setShowInstallBanner(false);
  }

  const ri = investRate / 100;
  const rl = loanRate / 100;

  // 자동 저장 (localStorage)
  useEffect(() => {
    if (isFirstRun.current) {
      isFirstRun.current = false;
      return;
    }
    const state = { salary, bonus, mgmtFee, moveCost, livingCost, investRate, loanRate, years, currentNetWorth, properties };
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      setShowSaved(true);
      clearTimeout(saveTimer.current);
      saveTimer.current = setTimeout(() => setShowSaved(false), 1200);
    } catch (e) {
      // 저장 실패 시 조용히 무시
    }
  }, [salary, bonus, mgmtFee, moveCost, livingCost, investRate, loanRate, years, currentNetWorth, properties]);

  function updateProperty(id, patch) {
    setProperties((prev) => prev.map((p) => (p.id === id ? { ...p, ...patch } : p)));
  }

  function changeType(id, newType) {
    setProperties((prev) =>
      prev.map((p) => {
        if (p.id !== id) return p;
        const fresh = makeProperty(newType, p.name);
        return { ...fresh, id: p.id, name: p.name };
      })
    );
  }

  function addProperty() {
    setProperties((prev) => [...prev, makeProperty("jeonse", `매물 ${prev.length + 1}`)]);
  }

  function removeProperty(id) {
    setProperties((prev) => prev.filter((p) => p.id !== id));
  }

  function projectAsset(monthlySavings, investedLumpSum, equityToReturn, yearsN) {
    if (monthlySavings < 0) monthlySavings = 0;
    let asset = investedLumpSum;
    const path = [{ year: 0, asset: Math.round(asset + equityToReturn) }];
    for (let y = 1; y <= yearsN; y++) {
      const yearlyContribution = monthlySavings * 12 + bonus;
      asset = asset * (1 + ri) + yearlyContribution * (1 + ri / 2);
      path.push({ year: y, asset: Math.round(asset + equityToReturn) });
    }
    return { final: asset + equityToReturn, investedFinal: asset, path };
  }

  const computed = useMemo(() => {
    return properties.map((p) => {
      const deposit = Number(p.deposit) || 0;
      const loan = Math.max(Math.min(Number(p.loan) || 0, deposit), 0);
      const equity = Math.max(deposit - loan, 0);
      const loanInterestMonthly = (loan * rl) / 12;
      const rent = Number(p.rent) || 0;

      let opportunityCostMonthly = 0;
      let monthlyHousingCost;
      if (p.type === "jeonse") {
        opportunityCostMonthly = (equity * ri) / 12;
        monthlyHousingCost = loanInterestMonthly + opportunityCostMonthly;
      } else {
        monthlyHousingCost = loanInterestMonthly + rent;
      }

      const monthlySavings = salary - monthlyHousingCost - mgmtFee - livingCost;
      const firstMonthAvailable = monthlySavings - moveCost;

      const netWorth = Number(currentNetWorth) || 0;
      const investedLumpSum = Math.max(netWorth - equity, 0);
      const projection = projectAsset(monthlySavings, investedLumpSum, equity, years);

      return {
        ...p,
        deposit,
        loan,
        equity,
        rent,
        loanInterestMonthly,
        opportunityCostMonthly,
        monthlyHousingCost,
        monthlySavings,
        firstMonthAvailable,
        investedLumpSum,
        final: projection.final,
        investedFinal: projection.investedFinal,
        path: projection.path,
      };
    });
  }, [properties, salary, mgmtFee, livingCost, moveCost, ri, rl, bonus, years, currentNetWorth]);

  const ranked = useMemo(() => [...computed].sort((a, b) => b.final - a.final), [computed]);
  const best = ranked[0];
  const worst = ranked[ranked.length - 1];
  const diff = best && worst ? best.final - worst.final : 0;
  const maxPath = Math.max(1, ...computed.flatMap((c) => c.path.map((pt) => pt.asset)));

  return (
    <div className="page">
      {showInstallBanner && (
        <div className="install-banner show">
          홈 화면에 추가하면 앱처럼 바로 실행할 수 있어요
          <button onClick={handleInstallClick}>추가하기</button>
          <button onClick={dismissInstallBanner} style={{ background: "transparent", color: "#1f2420", marginLeft: 6 }}>
            ✕
          </button>
        </div>
      )}

      <div className="hero">
        <div className="hero-eyebrow">매물 비교 계산기</div>
        <h1>내 돈, 어디 두는 게<br />더 불어날까</h1>
        <p>매물을 추가하고 전세·반전세·월세 중 형태를 골라 입력하면, {years}년 뒤 예상 자산까지 한눈에 비교해드려요.</p>
      </div>

      <div className="container">
        <div className="section-title"><span className="section-title-left"><span className="dot dot-shared" />공통 가정</span></div>
        <div className="card">
          <div className="small-grid">
            <NumberField label="월급" value={salary} onChange={setSalary} />
            <NumberField label="연 수당" value={bonus} onChange={setBonus} />
            <NumberField label="관리비" value={mgmtFee} onChange={setMgmtFee} />
            <NumberField label="이동비용(1회)" value={moveCost} onChange={setMoveCost} />
            <NumberField label="생활비" value={livingCost} onChange={setLivingCost} />
            <NumberField label="투자 금리" value={investRate} onChange={setInvestRate} suffix="% / 년" />
            <NumberField label="대출 금리" value={loanRate} onChange={setLoanRate} suffix="% / 년" />
          </div>
          <div style={{ marginTop: 12 }}>
            <NumberField label="현재 보유 자산" value={currentNetWorth} onChange={setCurrentNetWorth} />
          </div>
          <div style={{ marginTop: 12 }}>
            <NumberField label="투자 기간" value={years} onChange={setYears} suffix="년" />
          </div>
        </div>

        <div className="section-title"><span className="section-title-left"><span className="dot dot-shared" />매물 입력 ({properties.length}개)</span></div>

        {computed.length === 0 && (
          <div className="empty-state">아직 등록된 매물이 없어요. 아래 버튼으로 추가해보세요.</div>
        )}

        {computed.map((p) => {
          const meta = TYPE_META[p.type];
          const rankIndex = ranked.findIndex((r) => r.id === p.id);
          return (
            <div className="card" style={{ borderLeft: `4px solid ${meta.color}` }} key={p.id}>
              <div className="panel-head">
                <div className="property-name-row">
                  <input
                    className="property-name-input"
                    value={p.name}
                    onChange={(e) => updateProperty(p.id, { name: e.target.value })}
                    placeholder="매물 이름"
                  />
                </div>
                <span
                  className="panel-rank"
                  style={{
                    background: rankIndex === 0 ? "#eaf3ee" : "#f3f1ea",
                    color: rankIndex === 0 ? "#3b6e5e" : "#8a8275",
                  }}
                >
                  {rankIndex === 0 ? "1위" : `${rankIndex + 1}위`}
                </span>
                {properties.length > 1 && (
                  <button className="remove-btn" onClick={() => removeProperty(p.id)} aria-label="매물 삭제">
                    ✕
                  </button>
                )}
              </div>

              <TypeSwitch value={p.type} onChange={(newType) => changeType(p.id, newType)} />

              {p.type === "jeonse" && (
                <div className="grid2">
                  <NumberField label="전세 보증금" value={p.deposit} onChange={(v) => updateProperty(p.id, { deposit: v })} />
                  <NumberField label="대출 가능 금액" value={p.loan} onChange={(v) => updateProperty(p.id, { loan: v })} />
                </div>
              )}

              {(p.type === "wolse" || p.type === "banjeonse") && (
                <>
                  <div className="grid2">
                    <NumberField label="보증금" value={p.deposit} onChange={(v) => updateProperty(p.id, { deposit: v })} />
                    <NumberField label="보증금 중 대출액" value={p.loan} onChange={(v) => updateProperty(p.id, { loan: v })} />
                  </div>
                  <div style={{ marginTop: 12 }}>
                    <NumberField label="월세" value={p.rent} onChange={(v) => updateProperty(p.id, { rent: v })} />
                  </div>
                </>
              )}

              <div className="result-list">
                <div className="result-row">
                  <span className="k">필요한 내 자본 (보증금 − 대출)</span>
                  <span className="v">{manwon(p.equity)}만원</span>
                </div>
                <div className="result-row">
                  <span className="k">현재 자산 중 투자되는 금액</span>
                  <span className="v">{manwon(p.investedLumpSum)}만원</span>
                </div>
                {p.type === "jeonse" ? (
                  <>
                    <div className="result-row">
                      <span className="k">전세대출 이자 (연 {loanRate}%)</span>
                      <span className="v">{manwon(p.loanInterestMonthly)}만원/월</span>
                    </div>
                    <div className="result-row">
                      <span className="k">자기자본 기회비용 (연 {investRate}%)</span>
                      <span className="v">{manwon(p.opportunityCostMonthly)}만원/월</span>
                    </div>
                  </>
                ) : (
                  <>
                    <div className="result-row">
                      <span className="k">보증금 대출이자 (연 {loanRate}%)</span>
                      <span className="v">{manwon(p.loanInterestMonthly)}만원/월</span>
                    </div>
                    <div className="result-row">
                      <span className="k">월세 + 대출이자</span>
                      <span className="v">−{manwon(p.monthlyHousingCost)}만원/월</span>
                    </div>
                  </>
                )}
                <div className="result-row">
                  <span className="k">관리비 + 생활비</span>
                  <span className="v">−{manwon(mgmtFee + livingCost)}만원/월</span>
                </div>
                <div className="result-row">
                  <span className="k">입주 첫 달 가용액 (이동비용 차감)</span>
                  <span className="v">{manwon(p.firstMonthAvailable)}만원</span>
                </div>
                <div className={`result-row total ${p.monthlySavings < 0 ? "neg" : "pos"}`}>
                  <span className="k">월 저축 가능액</span>
                  <span className="v">{manwon(p.monthlySavings)}만원/월</span>
                </div>
              </div>
              {p.monthlySavings < 0 && <span className="warn-badge">⚠ 매월 적자예요</span>}
            </div>
          );
        })}

        <button className="add-btn" onClick={addProperty}>+ 매물 추가하기</button>

        {computed.length > 0 && (
          <div className="compare-card">
            <div className="label">{years}년 뒤 예상 자산</div>
            <div className="compare-winner">
              <span className={TYPE_META[best.type].accent}>{best.name}</span>
              {computed.length > 1 && "가 가장 유리해요"}
            </div>
            {computed.length > 1 && (
              <div className="compare-sub">최선 대비 최악 차액 약 {manwon(diff)}만원</div>
            )}
            <div className="bars">
              {ranked.map((p) => (
                <div className="bar-row" key={p.id}>
                  <span className="bar-label">{p.name}</span>
                  <div className="bar-track">
                    <div
                      className={`bar-fill ${TYPE_META[p.type].bar}`}
                      style={{ width: `${Math.max((p.final / maxPath) * 100, 6)}%` }}
                    >
                      {manwon(p.final)}만
                    </div>
                  </div>
                </div>
              ))}
            </div>
            <div className="assumptions">
              매월 저축액 × 12 + 연 수당 {manwon(bonus)}만원을 매년 재투자, 연 복리 {investRate}%(투자 금리) 가정. 현재 보유 자산 {manwon(currentNetWorth)}만원 중 보증금 자기자본으로 묶이는 금액을 제외한 나머지를 처음부터 투자한 것으로 계산했어요. 최종 자산 = 투자 성장분 + 매달 모은 돈의 성장분 + 만기에 돌려받는 보증금(자기자본)입니다.
            </div>
          </div>
        )}

        <div className="footnote">
          ※ 전세·반전세·월세 보증금 대출이자는 모두 대출 금리(연 {loanRate}%) 기준 만기일시상환(이자만 매월 차감, 원금은 만기에 상환)이고, 전세의 자기자본 기회비용과 자산 재투자 수익률은 투자 금리(연 {investRate}%)를 따로 적용했어요. 보증금 중 대출액을 제외한 자기자본분은 투자되지 않고 묶여 있다가 {years}년 뒤 그대로 돌려받는 것으로 계산했어요. 이동비용은 입주 첫 달에만 1회 차감되고, 월 저축액(정상상태)에는 포함되지 않아요. 실제 세금·중개수수료·금리 변동 등은 반영되지 않은 단순 비교용 계산입니다.
        </div>
      </div>

      <div className={`save-pill ${showSaved ? "show" : ""}`}>저장됨</div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

<script>
  // Service worker 등록 (오프라인 지원 + 홈 화면 추가 가능하게)
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    });
  }
</script>
</body>
</html>
